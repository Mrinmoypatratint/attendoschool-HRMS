<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Deep Emerald Shield Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="40%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Gold Foil Stroke -->
    <linearGradient id="goldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#emeraldGlow)"/>

  <!-- Outer Ring with Notches -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="8 4"/>
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>

  <!-- Laurel Wreath Left -->
  <g fill="url(#goldGradient)" opacity="0.9">
    <path d="M 120 280 C 110 240, 115 190, 150 140 C 145 160, 140 190, 148 220 Z"/>
    <path d="M 110 240 C 95 210, 105 170, 130 135 C 130 155, 120 185, 132 210 Z"/>
    <path d="M 130 310 C 115 285, 118 250, 140 220 C 142 240, 135 270, 152 290 Z"/>
    <path d="M 145 350 C 130 325, 132 290, 155 260 C 158 280, 150 310, 168 330 Z"/>
    <path d="M 180 380 C 160 360, 158 330, 180 300 C 185 320, 180 345, 200 365 Z"/>
  </g>

  <!-- Laurel Wreath Right (Mirrored) -->
  <g fill="url(#goldGradient)" opacity="0.9" transform="translate(500, 0) scale(-1, 1)">
    <path d="M 120 280 C 110 240, 115 190, 150 140 C 145 160, 140 190, 148 220 Z"/>
    <path d="M 110 240 C 95 210, 105 170, 130 135 C 130 155, 120 185, 132 210 Z"/>
    <path d="M 130 310 C 115 285, 118 250, 140 220 C 142 240, 135 270, 152 290 Z"/>
    <path d="M 145 350 C 130 325, 132 290, 155 260 C 158 280, 150 310, 168 330 Z"/>
    <path d="M 180 380 C 160 360, 158 330, 180 300 C 185 320, 180 345, 200 365 Z"/>
  </g>

  <!-- Central Crest Shield -->
  <path d="M 250 80 Q 320 80 350 120 C 350 250 290 340 250 370 C 210 340 150 250 150 120 Q 180 80 250 80 Z"
        fill="url(#shieldGradient)" stroke="url(#goldStroke)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Inner Shield Trim -->
  <path d="M 250 95 Q 310 95 335 130 C 335 240 285 320 250 350 C 215 320 165 240 165 130 Q 190 95 250 95 Z"
        fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>

  <!-- Quartering Lines in Shield -->
  <line x1="250" y1="100" x2="250" y2="345" stroke="url(#goldGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="165" y1="210" x2="335" y2="210" stroke="url(#goldGradient)" stroke-width="2" opacity="0.4"/>

  <!-- Top-Left: Torch of Knowledge -->
  <g transform="translate(195, 145) scale(0.7)" fill="url(#goldGradient)">
    <!-- Flame -->
    <path d="M 15 0 C 20 -15, 35 -10, 30 5 C 40 -5, 45 10, 35 25 C 25 35, 10 30, 15 0 Z" fill="#fbbf24"/>
    <path d="M 20 5 C 25 -5, 32 0, 30 10 C 25 18, 18 15, 20 5 Z" fill="#ef4444"/>
    <!-- Torch Bowl & Handle -->
    <path d="M 10 25 L 40 25 L 35 45 L 15 45 Z"/>
    <path d="M 22 45 L 22 75 L 28 75 L 28 45 Z"/>
  </g>

  <!-- Top-Right: Open Book of Wisdom -->
  <g transform="translate(275, 145) scale(0.75)" fill="none" stroke="url(#goldGradient)" stroke-width="3">
    <path d="M 5 35 Q 25 25 45 35 Q 65 25 85 35 L 85 65 Q 65 55 45 65 Q 25 55 5 65 Z" fill="#ffffff" fill-opacity="0.1"/>
    <path d="M 45 35 L 45 65"/>
    <line x1="15" y1="42" x2="38" y2="42" stroke="url(#goldGradient)" stroke-width="2"/>
    <line x1="15" y1="50" x2="38" y2="50" stroke="url(#goldGradient)" stroke-width="2"/>
    <line x1="52" y1="42" x2="75" y2="42" stroke="url(#goldGradient)" stroke-width="2"/>
    <line x1="52" y1="50" x2="75" y2="50" stroke="url(#goldGradient)" stroke-width="2"/>
  </g>

  <!-- Bottom-Left: Atomic Rings (Science & Mathematics) -->
  <g transform="translate(205, 260) scale(0.65)" stroke="url(#goldGradient)" stroke-width="2" fill="none">
    <ellipse cx="25" cy="25" rx="28" ry="12" transform="rotate(30 25 25)"/>
    <ellipse cx="25" cy="25" rx="28" ry="12" transform="rotate(-30 25 25)"/>
    <circle cx="25" cy="25" r="4" fill="#fbbf24"/>
  </g>

  <!-- Bottom-Right: Tree of Growth (GreenWood Emblem) -->
  <g transform="translate(285, 255) scale(0.7)" fill="url(#goldGradient)">
    <path d="M 25 5 C 10 15, 5 35, 15 45 C 5 50, 10 65, 25 65 L 25 75 L 30 75 L 30 65 C 45 65, 50 50, 40 45 C 50 35, 45 15, 30 5 Z"/>
  </g>

  <!-- Central Star of Excellence -->
  <g transform="translate(250, 210) scale(0.8)">
    <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="url(#goldGradient)"/>
  </g>

  <!-- Banner Ribbon at Bottom -->
  <g transform="translate(0, 30)">
    <!-- Ribbon Tails -->
    <polygon points="70,390 120,380 120,415 70,425 90,405" fill="#ca8a04"/>
    <polygon points="430,390 380,380 380,415 430,425 410,405" fill="#ca8a04"/>

    <!-- Ribbon Main Body -->
    <path d="M 100 395 Q 250 365 400 395 L 390 425 Q 250 395 110 425 Z"
          fill="url(#shieldGradient)" stroke="url(#goldGradient)" stroke-width="3" filter="url(#shadow)"/>

    <!-- Institution Name on Ribbon -->
    <text x="250" y="415" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#fef08a" letter-spacing="2">
      GREENWOOD INTERNATIONAL
    </text>
  </g>

  <!-- Established Year & Motto -->
  <text x="250" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ca8a04" letter-spacing="3">
    ESTD 2004 • VERITAS ET EXCELLENTIA
  </text>
</svg>
