name: CI Validation & Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Typecheck, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Unit & Component Tests
        run: npm -w frontend run test

      - name: Full Monorepo Build Verification
        run: npm run build
        env:
          VITE_USE_EMULATOR: "true"
          VITE_FIREBASE_API_KEY: "mock-key-for-ci-build"
          VITE_FIREBASE_AUTH_DOMAIN: "mock-project.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "mock-project"
          VITE_FIREBASE_STORAGE_BUCKET: "mock-project.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: "1:123456789:web:mock"
