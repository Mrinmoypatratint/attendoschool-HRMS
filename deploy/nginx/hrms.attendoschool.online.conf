# ==============================================================================
# Nginx Virtual Host: hrms.attendoschool.online
# Platform: AttendoSchool Educational Institution HRMS SaaS
# Location on Hostinger VPS: /etc/nginx/sites-available/hrms.attendoschool.online.conf
# Enable: sudo ln -s /etc/nginx/sites-available/hrms.attendoschool.online.conf /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect & Let's Encrypt ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hrms.attendoschool.online;

    # Let's Encrypt ACME challenge directory (must remain accessible over HTTP for automated renewals)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://hrms.attendoschool.online$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Main Application Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.attendoschool.online;

    # Release Root: Points to the current release via atomic symlink
    root /var/www/hrms-attendoschool/current;
    index index.html;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/hrms.attendoschool.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.attendoschool.online/privkey.pem;

    # TLS Protocols & Ciphers (Modern, secure configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    # Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent Clickjacking (allow SAMEORIGIN for internal frames if needed)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (Restrict unneeded browser hardware features)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite content-hashed filenames in /assets/)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon, robots, and static manifest files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # HTML Index: Never cache index.html so releases take effect immediately
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # --------------------------------------------------------------------------
    # Single Page Application (SPA) Fallback Routing
    # --------------------------------------------------------------------------
    # Direct browser hits to /login, /attendance, /campuses, etc. fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
