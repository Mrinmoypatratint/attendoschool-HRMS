# Nginx Configuration for AttendoSchool HRMS on Hostinger VPS
# Place in: /etc/nginx/sites-available/attendoschool-hrms
# Enable with: sudo ln -s /etc/nginx/sites-available/attendoschool-hrms /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name hrms.yourdomain.com; # Replace with your domain/subdomain or VPS IP

    # Path to the compiled Vite production bundle
    root /var/www/attendoschool-hrms/frontend/dist;
    index index.html;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Aggressive caching for hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Essential for Single Page Applications (React Router)
    # Redirects all routes to index.html so browser refresh works on /attendance, /campuses, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
